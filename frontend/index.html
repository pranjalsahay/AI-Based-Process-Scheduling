<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SchedulAI — Socratic OS Tutor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css?v=2.5">
  <style>
    /* Critical Inline Fallback Layout (Ensures instantaneous styling even if external css is cached) */
    :root {
      --bg-primary: #212121;
      --bg-sidebar: #171717;
      --bg-main: #212121;
      --bg-card: #2f2f2f;
      --bg-input: #2f2f2f;
      --border-subtle: #2f2f2f;
      --border-card: #383838;
      --text-main: #ececec;
      --text-muted: #8e8e8e;
      --accent: #3b82f6;
      --user-bubble: #2f2f2f;
      --font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; width: 100%; overflow: hidden; font-family: var(--font-family); background: var(--bg-main); color: var(--text-main); }
    .chat-app { display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; }
    
    /* Sidebar */
    .chat-sidebar {
      width: 260px;
      min-width: 260px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: margin-left 0.2s ease;
      z-index: 10;
    }
    .chat-sidebar.collapsed { margin-left: -260px; }
    .sidebar-top { padding: 14px 12px; display: flex; flex-direction: column; gap: 12px; }
    .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px; }
    .brand-badge {
      width: 32px; height: 32px; border-radius: 8px; background: #262626;
      display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
      border: 1px solid #3a3a3a;
    }
    .brand-meta { display: flex; flex-direction: column; }
    .brand-title { font-size: 0.95rem; font-weight: 700; color: #fff; }
    .brand-subtitle { font-size: 0.72rem; color: var(--text-muted); }
    .btn-new-chat {
      display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 14px;
      background: transparent; color: #fff; border: 1px solid var(--border-card);
      border-radius: 8px; font-size: 0.88rem; font-weight: 500; cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }
    .btn-new-chat:hover { background: #262626; border-color: #555; }
    .sidebar-sessions { flex: 1; overflow-y: auto; padding: 10px 8px; }
    .sessions-header { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; color: var(--text-muted); padding: 6px 8px; }
    .session-list { display: flex; flex-direction: column; gap: 2px; }
    .session-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border-radius: 8px; color: #c5c5c5; font-size: 0.88rem;
      cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
    }
    .session-item:hover { background: #262626; color: #fff; }
    .session-item.active { background: #262626; color: #fff; font-weight: 500; }
    .btn-del-session { background: transparent; border: none; color: var(--text-muted); cursor: pointer; padding: 2px 6px; font-size: 1rem; border-radius: 4px; opacity: 0; }
    .session-item:hover .btn-del-session { opacity: 1; }
    .btn-del-session:hover { color: #ef4444; }
    .empty-sessions { color: var(--text-muted); font-size: 0.82rem; padding: 14px 8px; text-align: center; }

    /* Main Area */
    .chat-main { flex: 1; display: flex; flex-direction: column; height: 100%; background: var(--bg-main); overflow: hidden; position: relative; }
    .chat-header {
      height: 48px; border-bottom: 1px solid var(--border-subtle); display: flex;
      align-items: center; padding: 0 16px; gap: 12px; background: var(--bg-main);
    }
    .btn-icon {
      background: transparent; border: none; color: #b4b4b4; cursor: pointer;
      padding: 6px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    }
    .btn-icon:hover { background: #2f2f2f; color: #fff; }
    .header-info { display: flex; align-items: baseline; gap: 8px; }
    .chat-title { font-size: 0.95rem; font-weight: 600; color: #fff; }
    .chat-status { font-size: 0.72rem; color: #10b981; }

    /* Stream */
    .chat-stream { flex: 1; overflow-y: auto; padding: 24px 16px; display: flex; flex-direction: column; align-items: center; }
    .welcome-screen { max-width: 680px; width: 100%; margin: auto; text-align: center; display: flex; flex-direction: column; align-items: center; padding: 10px 0; }
    .welcome-icon {
      width: 50px; height: 50px; border-radius: 12px; background: #2a2a2a;
      border: 1px solid var(--border-card); display: flex; align-items: center;
      justify-content: center; font-size: 1.8rem; margin-bottom: 14px;
    }
    .welcome-screen h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 8px; color: #fff; }
    .welcome-tagline { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 32px; max-width: 480px; }
    .starter-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
    .starter-card {
      background: var(--bg-card); border: 1px solid var(--border-card); border-radius: 12px;
      padding: 14px 16px; text-align: left; cursor: pointer; display: flex; flex-direction: column;
      gap: 4px; color: #ececec; transition: border-color 0.15s ease, background 0.15s ease;
    }
    .starter-card:hover { border-color: #666; background: #353535; }
    .starter-card strong { font-size: 0.88rem; font-weight: 600; color: #fff; }
    .starter-card span { font-size: 0.78rem; color: var(--text-muted); }

    .messages-list { max-width: 768px; width: 100%; display: flex; flex-direction: column; gap: 24px; }
    .msg-row { display: flex; gap: 14px; width: 100%; }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.user .msg-bubble {
      background: #2f2f2f; color: #fff; border-radius: 18px 18px 4px 18px;
      padding: 10px 16px; max-width: 75%; font-size: 0.93rem; line-height: 1.5;
    }
    .msg-row.assistant .msg-avatar {
      width: 30px; height: 30px; border-radius: 6px; background: #2f2f2f;
      border: 1px solid var(--border-card); display: flex; align-items: center;
      justify-content: center; font-size: 0.95rem; flex-shrink: 0;
    }
    .msg-row.user .msg-avatar { display: none; }
    .msg-row.assistant .msg-body { flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .msg-row.assistant .msg-bubble { font-size: 0.95rem; line-height: 1.6; color: #ececec; word-break: break-word; }
    .msg-row.assistant .msg-bubble h1, .msg-row.assistant .msg-bubble h2, .msg-row.assistant .msg-bubble h3, .msg-row.assistant .msg-bubble h4 {
      margin: 12px 0 6px; font-weight: 600; color: #fff;
    }
    .msg-row.assistant .msg-bubble h3 { font-size: 1.05rem; }
    .msg-row.assistant .msg-bubble h4 { font-size: 0.95rem; }
    .msg-row.assistant .msg-bubble ul, .msg-row.assistant .msg-bubble ol { margin-left: 20px; margin-bottom: 8px; }
    .msg-row.assistant .msg-bubble li { margin-bottom: 4px; }
    .msg-row.assistant .msg-bubble blockquote { border-left: 3px solid var(--accent); padding-left: 12px; color: #b4b4b4; margin: 8px 0; font-style: italic; }
    .msg-row.assistant .msg-bubble table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 0.85rem; background: #262626; border-radius: 6px; overflow: hidden; }
    .msg-row.assistant .msg-bubble th, .msg-row.assistant .msg-bubble td { padding: 8px 12px; border: 1px solid var(--border-card); text-align: left; }
    .msg-row.assistant .msg-bubble th { background: #333333; font-weight: 600; }
    .msg-row.assistant .msg-bubble pre, .ascii-gantt-block {
      background: #111111; border: 1px solid var(--border-card); padding: 12px;
      border-radius: 8px; font-family: var(--font-mono); font-size: 0.82rem;
      overflow-x: auto; margin: 10px 0; color: #38bdf8; line-height: 1.4;
    }
    .msg-row.assistant .msg-bubble code { background: #1a1a1a; padding: 2px 6px; border-radius: 4px; font-family: var(--font-mono); font-size: 0.88rem; color: #60a5fa; }
    .msg-question-box {
      background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 10px 14px; border-radius: 8px; font-size: 0.9rem; margin-top: 6px; color: #93c5fd;
    }
    .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 6px 0; }
    .typing-dot { width: 6px; height: 6px; border-radius: 50%; background: #8e8e8e; animation: pulse 1.4s infinite ease-in-out; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }

    /* Footer / Input */
    .chat-footer { padding: 12px 16px 16px; background: var(--bg-main); display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%; }
    .input-container {
      max-width: 768px; width: 100%; display: flex; align-items: flex-end;
      background: var(--bg-input); border: 1px solid var(--border-card);
      border-radius: 24px; padding: 10px 16px; gap: 10px; transition: border-color 0.15s ease;
    }
    .input-container:focus-within { border-color: #666; }
    .input-container textarea {
      flex: 1; background: transparent; border: none; color: #fff;
      font-family: var(--font-family); font-size: 0.95rem; resize: none;
      outline: none; max-height: 180px; line-height: 1.4; padding: 4px 0;
    }
    .btn-send {
      background: #ffffff; color: #000000; border: none; border-radius: 50%;
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.15s ease; flex-shrink: 0;
    }
    .btn-send:hover:not(:disabled) { background: #e5e5e5; }
    .btn-send:disabled { background: #404040; color: #737373; cursor: not-allowed; opacity: 0.5; }
    .footer-caption { font-size: 0.72rem; color: var(--text-muted); text-align: center; }
  </style>
</head>
<body>
  <div class="chat-app">
    <!-- Collapsible Sidebar -->
    <aside class="chat-sidebar" id="sidebar">
      <div class="sidebar-top">
        <div class="brand">
          <div class="brand-badge">⚡</div>
          <div class="brand-meta">
            <span class="brand-title">SchedulAI</span>
            <span class="brand-subtitle">OS CPU Tutor</span>
          </div>
        </div>
        <button id="btn-new-chat" class="btn-new-chat" title="Start a fresh conversation">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="12" y1="5" x2="12" y2="19"></line>
            <line x1="5" y1="12" x2="19" y2="12"></line>
          </svg>
          New Chat
        </button>
      </div>

      <div class="sidebar-sessions">
        <div class="sessions-header">Conversations</div>
        <div class="session-list" id="session-list">
          <div class="empty-sessions">No saved chats</div>
        </div>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main class="chat-main">
      <!-- Top Bar -->
      <header class="chat-header">
        <button id="sidebar-toggle" class="btn-icon" title="Toggle Sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="header-info">
          <h1 class="chat-title" id="chat-title">SchedulAI</h1>
          <span class="chat-status" id="chat-status">Ready</span>
        </div>
      </header>

      <!-- Message Stream -->
      <div class="chat-stream" id="chat-stream">
        <!-- Welcome Screen shown when no messages -->
        <div class="welcome-screen" id="welcome-screen">
          <div class="welcome-icon">⚡</div>
          <h2>SchedulAI</h2>
          <p class="welcome-tagline">An intelligent Socratic tutor for Operating Systems CPU Process Scheduling.</p>
          
          <div class="starter-grid">
            <button class="starter-card" data-prompt="What is the difference between preemptive and non-preemptive scheduling?">
              <strong>Preemptive vs Non-Preemptive</strong>
              <span>Explore kernel preemption and context switching.</span>
            </button>
            <button class="starter-card" data-prompt="Explain Round Robin directly from the beginning.">
              <strong>Round Robin Algorithm</strong>
              <span>Learn time slicing and time quantum trade-offs.</span>
            </button>
            <button class="starter-card" data-prompt="What is the Convoy Effect in First-Come, First-Served?">
              <strong>Convoy Effect in FCFS</strong>
              <span>Understand CPU-bound and I/O-bound bottlenecks.</span>
            </button>
            <button class="starter-card" data-prompt="Take an example of FCFS with P1 burst 4 and P2 burst 3 and explain.">
              <strong>Worked Practice Problem</strong>
              <span>Calculate Gantt chart, Turnaround Time, and Waiting Time.</span>
            </button>
          </div>
        </div>

        <div class="messages-list" id="messages-list"></div>
        <div id="scroll-bottom"></div>
      </div>

      <!-- Input Area -->
      <footer class="chat-footer">
        <div class="input-container">
          <textarea
            id="user-input"
            rows="1"
            placeholder="Message SchedulAI..."
            aria-label="Message SchedulAI"
          ></textarea>
          <button id="btn-send" class="btn-send" title="Send message" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
        <div class="footer-caption">
          SchedulAI assesses your understanding and deterministically verifies CPU scheduling calculations.
        </div>
      </footer>
    </main>
  </div>

  <script src="/static/app.js?v=2.5"></script>
</body>
</html>
